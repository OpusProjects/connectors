name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.0 pytest -r requirements.txt
      - run: ruff format --check
      - run: ruff check
      - run: .github/scripts/check-public.sh
      - run: pytest
