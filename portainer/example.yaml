# Portainer as two unified-gitops applications over one connector: settings
# and environments with prune off, users with prune on (an allow-list). The
# credential key names become the CREDENTIAL_* variables the script reads;
# their values come from PORTAINER_API_KEY and LDAP_PASSWORD in unified-gitops'
# environment.
connectors:
  - name: portainer
    description: "Portainer"
    project: prj-unified-connectors
    path: portainer/portainer.py
    timeout_seconds: 120

credentials:
  - name: cred-portainer
    description: "Portainer access token"
    type: token
    env_prefix: PORTAINER
    secret_keys:
      api_key: API_KEY
  - name: cred-portainer-ldap
    description: "LDAP bind password Portainer signs users in with"
    type: token
    env_prefix: LDAP
    secret_keys:
      ldap_bind_password: PASSWORD

applications:
  - name: portainer
    description: "Portainer settings and environments"
    connector: portainer
    credentials: [cred-portainer, cred-portainer-ldap]
    config:
      url: "https://portainer.example.com"
    project: prj-portainer-state
    path: portainer
    sync_interval_seconds: 600
  - name: portainer-users
    description: "Who may sign in to Portainer"
    connector: portainer
    credentials: [cred-portainer]
    config:
      url: "https://portainer.example.com"
    project: prj-portainer-state
    path: portainer-users
    prune: true
    sync_interval_seconds: 600
