# Portainer as one unified-gitops application: settings, environments and
# users, with prune on so the users are an allow-list. The credential key names become the CREDENTIAL_* variables the script reads;
# their values come from PORTAINER_API_KEY and LDAP_PASSWORD in unified-gitops'
# environment.
connectors:
  - name: portainer
    description: "Portainer"
    project: prj-unified-connectors
    path: portainer/portainer.py
    timeout_seconds: 120

credentials:
  - name: cred-portainer
    description: "Portainer access token"
    type: token
    env_prefix: PORTAINER
    secret_keys:
      api_key: API_KEY
  - name: cred-portainer-ldap
    description: "LDAP bind password Portainer signs users in with"
    type: token
    env_prefix: LDAP
    secret_keys:
      ldap_bind_password: PASSWORD

applications:
  - name: portainer
    description: "Portainer settings, environments and users"
    connector: portainer
    credentials: [cred-portainer, cred-portainer-ldap]
    config:
      url: "https://portainer.example.com"
    project: prj-portainer-state
    path: portainer
    prune: true
    sync_interval_seconds: 600
