# Device42 as a unified-api source. The filter folder lives in a project of
# your own (see filters.example/ for its files); config_dir is its absolute
# path inside that project's checkout. The credential's keys become the
# CREDENTIAL_BASE_URL, CREDENTIAL_USERNAME and CREDENTIAL_PASSWORD variables
# the script reads; their values come from D42_BASE_URL, D42_USERNAME and
# D42_PASSWORD in unified-api's own environment.
connectors:
  - name: device42
    description: "Device42"
    type: script
    project: prj-unified-connectors
    path: device42/device42.py
    script_args: ["--list"]
    host_args: ["--host-with-groups", "{target}"]
    timeout_seconds: 600

credentials:
  - name: cred-device42
    description: "Device42 read-only API user"
    type: username_password
    env_prefix: D42
    secret_keys:
      base_url: BASE_URL
      username: USERNAME
      password: PASSWORD

sources:
  - name: src-device42
    description: "Device42 inventory"
    connector: device42
    credentials: [cred-device42]
    config:
      config_dir: "/var/lib/unified-api/projects/prj-filters/device42/lab"
      insecure: "false"
    sync_interval_seconds: 600
    ttl_seconds: 600
